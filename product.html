<!DOCTYPE html>
<html>

<head>
    <title>DailyCart - Product Details</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <h2>DailyCart</h2>

        <ul>
            <li><a href="index.html">Home</a></li>

            <li class="dropdown">
                <a href="">Categories</a>

                <div class="dropdown-menu">
                    <a href="fashion.html">Fashion</a>
                    <a href="grocery.html">Grocery</a>
                    <a href="home.html">Home Decor</a>
                    <a href="pets.html">Pet Supplies</a>
                    <a href="stationery.html">Stationery</a>
                </div>
            </li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="cart.html">Cart</a></li>
        </ul>
    </nav>

    <div class="product-details">

        <div class="details-image">
            <img id="productImage" src="" alt="product">
        </div>
        <div class="details-info">
            <h1 id="productName"></h1>
            <p class="price" id="productPrice"></p>
            <p id="productDescription"></p>
            <p> <b>Category:</b> <span id="productCategory"></span> </p>
            <p> <b>Size:</b> <span id="productSize"></span> </p>
            <p> <b>Color:</b> <span id="productColor"></span> </p>
            <p> <b>Availability:</b> <span id="productAvailability"></span> </p>
            <a href="cart.html" class="button"  onclick="addToCart()">Add to Cart</a>
            <a href="fashion.html" class="back-button">
                Back to Fashion
            </a>

        </div>
    </div>

    <footer>
        <p>&copy; 2026 DailyCart. All Rights Reserved.</p>
    </footer>

</body>

<!-- JavaScript -->
<script src="script.js"></script>

</html>
