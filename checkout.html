<html>
<head>
    <title>DailyCart - Checkout</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
 <nav>
        <h2 class="shop-name">Daily<span style="color: #69a2e8;">Cart</span></h2>

        <ul>
            <li><a href="index.html">Home</a></li>

            <li class="dropdown">
                <a href="">Categories</a>

                <div class="dropdown-menu">
                    <a href="fashion.html">Fashion</a>
                    <a href="grocery.html">Grocery</a>
                    <a href="home.html">Home Decor</a>
                    <a href="pets.html">Pet Supplies</a>
                    <a href="stationery.html">Stationery</a>
                </div>
            </li>

            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="cart.html">Cart</a></li>
        </ul>
    </nav>

    <h1 class="page-title">Checkout</h1>

    <div class="checkout-container">

        <div class="checkout-form">
            <h2>Customer Information</h2>

            <form onsubmit="alert('Order Placed Successfully! We will contact you soon.'); return false;">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your name" required>
                <label>Email</label>
                <input type="email" placeholder="Enter your email" required>

                <label>Phone Number</label>
                <input type="tel" placeholder="Enter your phone number" title="Phone number must start with 01 and contain 11 digits" pattern="01[0-9]{9}" required>

                <label>Address</label>
                <textarea placeholder="Enter your address" required></textarea>

                <h2>Payment Method</h2>
                <input type="radio" id="cod" name="payment" value="cod" required>
                <label for="cod">Cash on Delivery</label>

                <br>

                <input type="radio" id="bkash" name="payment" value="bkash" required>
                <label for="bkash">bKash</label>

                <br>

                <input type="radio" id="card" name="payment" value="card" required>
                <label for="card">Card Payment</label>

                <br><br>

                <input type="submit" value="Place Order" class="button">

            </form>
        </div>

        <div class="order-summary">

            <h2>Order Summary</h2>

            <div class="summary-item">
                <span id="checkoutProduct">Product</span>
                <span id="checkoutPrice">৳0</span>
            </div>

            <div class="summary-item">
                <span>Delivery</span>
                <span id="checkoutDelivery">৳100</span>
            </div>

            <hr>

            <div class="summary-total">
                <span>Total</span>
                <span id="checkoutTotal">৳0</span>
            </div>

        </div>

    </div>
    <footer>
        <p>&copy; 2026 DailyCart. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
