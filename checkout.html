    <h1 class="page-title">Checkout</h1>

    <div class="checkout-container">

        <div class="checkout-form">
            <h2>Customer Information</h2>

            <form onsubmit="alert('Order Placed Successfully!')">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your name" required>
                <label>Email</label>
                <input type="email" placeholder="Enter your email" required>

                <label>Phone Number</label>
                <!-- <input type="text" placeholder="Enter your phone number" required> -->
                 <input type="tel" placeholder="Enter your phone number" pattern="[0-9]{11}" required>

                <label>Address</label>
                <textarea placeholder="Enter your address" required></textarea>

                <h2>Payment Method</h2>
                <input type="radio" name="payment" value="cod" required>
                <label for="cod">Cash on Delivery</label>   
                <br>
                <input type="radio" name="payment" value="bkash" required>
                <label for="bkash">bKash</label>

                <br>
                <input type="radio" name="payment" value="card" required>
                <label for="card">Card Payment</label>

                <br><br>

                <input type="submit" value="Place Order" class="button">

            </form>
        </div>

        <div class="order-summary">

            <h2>Order Summary</h2>

            <div class="summary-item">
                <span id="checkoutProduct">Product</span>
                <span id="checkoutPrice">৳0</span>
            </div>

            <div class="summary-item">
                <span>Delivery</span>
                <span id="checkoutDelivery">৳100</span>
            </div>

            <hr>

            <div class="summary-total">
                <span>Total</span>
                <span id="checkoutTotal">৳0</span>
            </div>

        </div>

    </div>
    <footer>
        <p>&copy; 2026 DailyCart. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
